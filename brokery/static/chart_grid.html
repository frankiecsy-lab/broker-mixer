<!DOCTYPE html>
<!-- 多週期圖表載體頁：桌面 GUI（QWebEngineView）與驗收（Playwright）均載入呢頁，再由外層經
     BrokeryGrid.build 建立格子、經 BrokeryGrid.set 注入資料。頁面本身不含任何文字，亦不取數。
     格子佈局屬載體頁（一屏三格、行數按格子數自動分配），與 home.html 的同名樣式保持一致。 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brokery chart grid</title>
<script src="echarts.min.js"></script>
<script src="chart.js"></script>
<script src="chart_grid.js"></script>
<style>
  html, body { margin:0; height:100%; background:#12161c; color:#dfe6ef;
               font:12px/1.4 "Segoe UI","Microsoft JhengHei",sans-serif; }
  #grid { width:100%; height:100%; box-sizing:border-box; }
  .brokery-grid { display:grid; height:100%; grid-template-columns:repeat(3,1fr);
                  grid-auto-rows:1fr; gap:6px; }
  .brokery-cell { display:flex; flex-direction:column; min-width:0; min-height:0;
                  border:1px solid #262d38; border-radius:4px; overflow:hidden; }
  .brokery-tabs { display:flex; flex-wrap:nowrap; gap:2px; padding:3px 3px 0; }
  .brokery-tabs button { flex:1 1 auto; min-width:0; padding:2px 0; cursor:pointer;
                         font:10px/1.2 inherit; color:#8a97a8; background:#1b222c;
                         border:1px solid #262d38; border-radius:3px; }
  .brokery-tabs button.on { color:#dfe6ef; background:#2b3a4d; border-color:#3d566f; }
  .brokery-note { padding:1px 4px; font-size:10px; color:#8a97a8;
                  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brokery-pane { flex:1 1 auto; min-height:0; }
</style>
</head>
<body>
<div id="grid"></div>
<script>
// 載入完成與否都要讓外層知道：無 ECharts 時界面要顯示明確訊息，而不是留一塊空白。
window.brokeryGridReady = Boolean(window.echarts && window.BrokeryChart && window.BrokeryGrid);
window.brokeryGridMissing = window.brokeryGridReady ? '' : 'ECharts 未能載入';
</script>
</body>
</html>

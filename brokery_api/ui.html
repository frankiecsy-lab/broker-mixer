<!DOCTYPE html>
<!-- brokery api 控制台：K 線、戶口、標的清單與日誌。所有資料均由帶金鑰的接口取得。 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brokery api 控制台</title>
<!-- 圖表規格只有一份：由閘道的 /static 載入本地副本（無 CDN，離線與 Docker 都畫到圖） -->
<script src="/static/echarts.min.js"></script>
<script src="/static/chart.js"></script>
<style>
  :root { --bg:#12161c; --panel:#1a2028; --line:#2b3441; --fg:#dfe6ef; --dim:#8a97a8;
          --up:#e0524a; --down:#2ea36f; --accent:#4b9ece; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 "Segoe UI","Microsoft JhengHei",sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; font-weight:600; }
  .dot { width:10px; height:10px; border-radius:50%; background:#6b7684; display:inline-block; }
  .dot.on { background:var(--down); } .dot.off { background:var(--up); }
  input, select, button { background:#0f1318; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:5px 8px; font:inherit; }
  button { cursor:pointer; background:var(--accent); border-color:var(--accent); color:#08131c; font-weight:600; }
  button.ghost { background:#0f1318; color:var(--fg); border-color:var(--line); font-weight:400; }
  label { color:var(--dim); font-size:12px; }
  nav { display:flex; gap:4px; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  nav button { background:transparent; border:1px solid transparent; color:var(--dim); font-weight:400; }
  nav button.active { color:var(--fg); border-color:var(--line); background:#0f1318; }
  main { padding:16px; }
  section { display:none; } section.active { display:block; }
  .bar { display:flex; gap:8px; align-items:end; flex-wrap:wrap; margin-bottom:12px; }
  .bar > div { display:flex; flex-direction:column; gap:2px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; }
  #chart { height:460px; }
  .msg { color:var(--dim); margin:8px 0; }
  .msg.err { color:var(--up); }
  .msg.warn { color:#d8a24a; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:4px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--dim); font-weight:500; position:sticky; top:0; background:var(--panel); }
  .scroll { max-height:420px; overflow:auto; }
  .lvl-WARNING { color:var(--up); } .lvl-ERROR { color:var(--up); font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
  .card { background:#0f1318; border:1px solid var(--line); border-radius:6px; padding:10px; }
  .card b { display:block; font-size:17px; }
  .card span { color:var(--dim); font-size:12px; }
  #brokers { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-left:auto; }
  .chip { display:inline-flex; gap:6px; align-items:center; padding:3px 9px; background:#0f1318;
          border:1px solid var(--line); border-radius:12px; font-size:12px; }
  .chip b { font-weight:600; } .chip i { color:var(--dim); font-style:normal; }
  .chip-off { border-color:#7a4a20; } .chip-off b, .chip-off i { color:#d8a24a; }
  .msg.busy { color:var(--accent); }
  .panels { display:grid; grid-template-columns:repeat(auto-fit,minmax(430px,1fr)); gap:12px; margin-bottom:12px; }
  .srcp { padding:10px; }
  .phead { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:4px; }
  .phead b { font-size:13px; } .phead .msg { margin:0; }
</style>
</head>
<body>
<header>
  <h1>brokery api</h1>
  <span class="dot" id="dot"></span>
  <div><label>API Key</label><input id="key" type="password" size="34" placeholder="自訂金鑰"></div>
  <button id="connect">連接</button>
  <span id="status" class="msg">未連接</span>
  <span id="sources" class="msg"></span>
  <div id="brokers"></div>
  <button id="b-probe" class="ghost" title="以一次戶口查詢探測各券商的連線與延遲，不自動重複執行">探測連線</button>
</header>

<nav>
  <button data-tab="kline" class="active">K 線</button>
  <button data-tab="accounts">戶口</button>
  <button data-tab="codes">標的</button>
  <button data-tab="logs">日誌</button>
</nav>

<main>
<section id="tab-kline" class="active">
  <div class="bar">
    <div><label>代碼</label><input id="k-code" value="HK.HSImain" size="14"></div>
    <div><label>週期</label><select id="k-ktype"></select></div>
    <div><label>根數</label><input id="k-count" type="number" value="1000" min="1" max="1000" style="width:80px"></div>
    <div><label>來源</label><select id="k-broker"></select></div>
    <div><label>複權</label><select id="k-autype"><option value="">預設</option></select></div>
    <button id="k-load">取歷史</button>
    <button id="k-stream" class="ghost">訂閱實時</button>
  </div>
  <div class="panel">
    <div id="chart"></div>
    <div id="k-msg" class="msg"></div>
    <div class="scroll" id="k-table"></div>
  </div>
</section>

<section id="tab-accounts">
  <div class="bar">
    <div><label>戶口性質</label><select id="a-type"><option value="all">全部</option></select></div>
    <div><label>幣種</label><input id="a-currency" size="6" placeholder="不限"></div>
    <button id="a-load">取得戶口</button>
    <!-- 自動更新以秒為單位，0 即不自動更新（預設）：一次取得要跨四家取數，預設不喺背景持續打券商。 -->
    <label>自動更新（秒）<input id="a-interval" type="number" min="0" step="5" value="0" style="width:64px"></label>
    <span id="a-at" class="msg"></span>
  </div>
  <div id="a-sources" class="bar"></div>
  <div class="grid" id="a-cards"></div>
  <div class="panel" style="margin-top:12px"><div class="scroll" id="a-table"></div><div id="a-msg" class="msg"></div></div>
</section>

<section id="tab-codes">
  <div class="bar">
    <button data-list="stocks">股票清單</button>
    <button data-list="futures">期貨清單</button>
    <button data-list="indices">指數清單</button>
    <button data-list="all">全部</button>
    <!-- 離線 CODES 按券商各存一檔：「讀取」只讀該檔（不打券商，實測 0.03s），「更新」才向該家重拉並覆蓋。 -->
    <button data-list="codes" title="離線讀回所選券商存放的 CODES，不向券商取數">讀取離線 CODES</button>
    <button id="c-refresh" title="向所選券商重拉全量 CODES 並覆蓋其離線快照（需券商連線，約數秒）">更新離線 CODES</button>
    <div><label>券商</label><select id="c-broker"></select></div>
    <div><label>市場</label><input id="c-markets" value="HK,US" size="10"></div>
    <div><label>篩選</label><input id="c-filter" size="16" placeholder="代碼或名稱"></div>
    <!-- 同戶口頁：0 即不自動更新（預設）。未選「自動向券商重拉」時定時器只重讀離線快照，不打券商。 -->
    <label>自動更新（秒）<input id="c-interval" type="number" min="0" step="5" value="0" style="width:64px"></label>
    <label><input id="c-live" type="checkbox"> 自動向券商重拉</label>
    <span id="c-count" class="msg"></span>
    <span id="c-snapshot" class="msg"></span>
  </div>
  <!-- 即時清單按來源分四區，每區只放該家返回的行。 -->
  <div id="c-panels" class="panels"></div>
  <!-- 離線 CODES 為存放快照，唔涉及即時取數；能力聲明讀取失敗時亦無法分區。兩者一律以單一表格顯示。 -->
  <div class="panel" id="c-raw" hidden>
    <div class="phead"><b id="c-raw-title"></b><i id="c-raw-info" class="msg"></i></div>
    <div class="scroll" id="c-raw-table"></div>
  </div>
  <div id="c-msg" class="msg"></div>
</section>

<section id="tab-logs">
  <div class="bar">
    <button id="l-load">重新載入</button>
    <label><input id="l-auto" type="checkbox" checked> 自動更新（3 秒）</label>
    <div><label>條數</label><input id="l-limit" type="number" value="200" min="1" max="500" style="width:70px"></div>
  </div>
  <div class="panel"><div class="scroll" id="l-table"></div><div id="l-msg" class="msg"></div></div>
</section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { key: localStorage.getItem('gw_key') || '', caps: null, cols: [], rows: [], list: '', listUrl: '', ws: null };
$('key').value = state.key;

function setStatus(ok, text) {
  $('dot').className = 'dot ' + (ok === null ? '' : ok ? 'on' : 'off');
  $('status').textContent = text;
  $('status').className = 'msg' + (ok === false ? ' err' : '');
}

let inFlight = 0;   // 進行中的請求數：定時更新只在沒有在途請求時觸發，否則慢請求會逐秒疊加

async function api(path, params = {}) {
  const url = new URL(path, location.origin);
  for (const [k, v] of Object.entries(params)) if (v !== '' && v !== null && v !== undefined) url.searchParams.set(k, v);
  let res, body;
  inFlight++;
  try {
    res = await fetch(url, { headers: { 'X-API-Key': state.key } });
    body = await res.json();
  } catch (e) {
    setStatus(false, '請求失敗：' + e);
    return { status: false, message: String(e), data: { columns: [], rows: [] } };
  } finally {
    inFlight--;
  }
  if (res.status === 401 || res.status === 403) { setStatus(false, body.detail || '鑑權失敗'); return body; }
  return body;
}

function note(id, body) {
  const el = $(id);
  el.textContent = body.message || '';
  // 業務成功但 message 帶「注意：／部分…失敗」即個別券商未能完成：仍算成功，但用警告色，
  // 否則用戶只見到結果少咗一间券商，唔知原因。
  const partial = body.status && /注意：|部分/.test(body.message || '');
  el.className = 'msg' + (body.status ? (partial ? ' warn' : '') : ' err');
}

// 讀取提示：跨四家的請求可達十幾秒（例如 IB 未連時要等滿超時），沒有提示時頁面看似冇反應，
// 用戶會以為撳咗無效果而重覆撳。提示寫在該頁的訊息位，返回時由 note() 覆蓋。
function loading(id, text = '讀取中…', delay = 0) {
  const el = $(id);
  const show = () => { el.textContent = text; el.className = 'msg busy'; };
  if (!delay) { show(); return () => {}; }
  // delay：3 秒輪詢的日誌等快速請求，若一律即時顯示會每 3 秒閃一次，故慢先示警。
  const timer = setTimeout(show, delay);
  return () => clearTimeout(timer);
}

// 請求期間禁用觸發按鈕，避免同一請求重覆送出（各家各有一条連線名額）。
async function withBusy(btn, task) {
  if (btn) btn.disabled = true;
  try { return await task(); } finally { if (btn) btn.disabled = false; }
}

// 按來源汇总：每间已啟用的券商各一個指示，取不到者點名。沒有這一步，某間券商沒有返回時只是表
// 少咗幾行，用戶無從察覺（例如 IB 被後端拒絕時）。
function sourceSummary(el, payload) {
  const cols = payload.columns || [], rows = payload.rows || [];
  const i = cols.indexOf('source');
  const count = new Map();
  if (i >= 0) rows.forEach((r) => { const s = String(r[i] === null ? '' : r[i]); count.set(s, (count.get(s) || 0) + 1); });
  const known = state.caps ? state.caps.sources : [];
  const listed = [...new Set([...known, ...count.keys()])];
  el.innerHTML = listed.map((s) => {
    const n = count.get(s) || 0;
    return `<span class="chip${n ? '' : ' chip-off'}"><b>${esc(s)}</b><i>${n || '0 · 無返回'}</i></span>`;
  }).join('');
}

// 來源排第一：清單由多家合併，第一欄就要見到每條出自邊間。
function sourceFirst(payload) {
  const cols = payload.columns || [];
  const i = cols.indexOf('source');
  if (i <= 0) return payload;
  const order = [i, ...cols.map((_, n) => n).filter((n) => n !== i)];
  return { columns: order.map((n) => cols[n]), rows: (payload.rows || []).map((r) => order.map((n) => r[n])) };
}

// 分區後每區已標明來源，再放一欄 source 只是重覆。
function dropSource(payload) {
  const cols = payload.columns || [];
  const i = cols.indexOf('source');
  if (i < 0) return payload;
  const keep = cols.map((_, n) => n).filter((n) => n !== i);
  return { columns: keep.map((n) => cols[n]), rows: (payload.rows || []).map((r) => keep.map((n) => r[n])) };
}

function renderTable(el, payload, limit = 300) {
  const cols = payload.columns || [], rows = payload.rows || [];
  if (!cols.length) { el.innerHTML = ''; return rows.length; }
  const head = cols.map((c) => `<th>${c}</th>`).join('');
  const body = rows.slice(0, limit).map((r) => `<tr>${r.map(cell).join('')}</tr>`).join('');
  el.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  return rows.length;
}
const cell = (v) => `<td>${v === null || v === undefined ? '' : v}</td>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- K 線 ----------
// 圖表與表格一律交共用規格 brokery/static/chart.js：呢度只攞數同餵數，唔再自己拼 ECharts option。
// 拉取與串流嘅序列經同一個 store 合併（key=(code,ts)，同 ts 覆蓋，保留最新 1000 根），所以一條只帶
// 最近 count 根的 update 唔會把已拉取嘅 1000 根歷史縮返 60 根。
const kline = { store: window.BrokeryChart ? BrokeryChart.store(1000) : null, key: '' };

// 換標的或換週期即換咗一個序列：唔清走舊 bar 會喺同一條軸上混埋兩份唔同週期嘅資料。
const klineKey = () => `${$('k-code').value.trim()}|${$('k-ktype').value}`;

function paintKline() {
  if (!kline.store) { $('chart').innerHTML = '<div class="msg">無圖表（未能載入 chart.js）</div>'; return; }
  const payload = kline.store.payload();
  if (!payload.rows.length || !window.echarts) {
    $('chart').innerHTML = '<div class="msg">無圖表（未能載入 ECharts，或返回不含 OHLC）</div>';
  } else {
    BrokeryChart.render($('chart'), payload, null, { ktype: $('k-ktype').value });
  }
  renderTable($('k-table'), BrokeryChart.desc(payload), 30);   // 按時間反序：最新在最上
}

function mergeKline(payload) {
  if (!kline.store) return;
  if (kline.key !== klineKey()) { kline.store.clear(); kline.key = klineKey(); }
  kline.store.add(payload);
  paintKline();
}

async function loadKline() {
  loading('k-msg', `向 ${$('k-broker').value || '預設來源'} 取 ${$('k-code').value.trim()} 的 K 線中…`);
  const body = await withBusy($('k-load'), () => api('/kline', {
    code: $('k-code').value.trim(), ktype: $('k-ktype').value, count: $('k-count').value,
    broker: $('k-broker').value, autype: $('k-autype').value,
  }));
  note('k-msg', body);
  if (!body.status) return;
  mergeKline(body.data);
}

// ---------- 串流 ----------
const say = (text, ok = true) => note('k-msg', { status: ok, message: text });

function streamIdle() {
  state.ws = null;
  $('k-stream').textContent = '訂閱實時';
}

function stopStream() {
  if (!state.ws) return;
  state.ws.send(JSON.stringify({ action: 'stop' }));
  state.ws.close();
  streamIdle();
}

// 先取歷史再訂閱：update 只帶最近 count 根，直接訂閱即得返一張只有最近幾十根的圖；普通行情軟件一律
// 係「歷史 + 實時」合併成一條連續序列。連歷史都無 bar 即唔訂閱（原因已由 loadKline 點名）。
async function startStream() {
  if (!state.key) { say('請先填自訂金鑰', false); return; }
  $('k-stream').disabled = true;
  await loadKline();
  $('k-stream').disabled = false;
  if (!kline.store || !kline.store.size) return;
  const url = new URL('/stream', location.origin);
  url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
  url.searchParams.set('api_key', state.key);  // 瀏覽器不能為握手自訂標頭，故走查詢參數
  const ws = new WebSocket(url);
  ws.onopen = () => {
    const request = { action: 'subscribe', codes: [$('k-code').value.trim()], ktype: $('k-ktype').value,
                      count: Number($('k-count').value) || 60, broker: $('k-broker').value };
    if ($('k-autype').value) request.autype = $('k-autype').value;
    ws.send(JSON.stringify(request));
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.event === 'update') {  // update 只帶最近 count 根：照樣經 store 合併，唔會蓋走已拉取嘅歷史
      mergeKline(msg.data);
      say(`已更新 ${msg.code}（本次 ${msg.data.rows.length} 根，合併後 ${kline.store ? kline.store.size : 0} 根）`);
    } else if (msg.event === 'subscribed') {
      say(`已訂閱 ${msg.broker} ${msg.codes.join(',')} ${msg.ktype}（${msg.seconds} 秒後自動結束）`);
    } else if (msg.event === 'end') {
      say(msg.message);
      streamIdle();
    } else if (msg.event === 'closed') {
      say(`已停止 ${msg.broker} ${msg.ktype} 串流`);
      streamIdle();
    } else {
      say(msg.message || msg.event, false);
    }
  };
  ws.onclose = () => { if (state.ws === ws) streamIdle(); };
  state.ws = ws;
  $('k-stream').textContent = '停止訂閱';
}

// ---------- 戶口 ----------
const MONEY = ['net_liquidation', 'cash', 'market_value', 'available_funds', 'buying_power', 'unrealized_pnl'];
function money(v) { return v === null || v === undefined ? '—' : Number(v).toLocaleString('zh-HK', { maximumFractionDigits: 2 }); }

// 戶口一律一次取齊四家（不選來源）：合併結果本身已帶 source 欄，分區指示會點名冇返回嘅那間。
async function loadAccounts() {
  loading('a-msg', '取得四家戶口中…');
  const body = await withBusy($('a-load'), () => api('/accounts', { acc_type: $('a-type').value, currency: $('a-currency').value.trim() }));
  note('a-msg', body);
  sourceSummary($('a-sources'), body.data);
  const rows = body.data.rows || [], cols = body.data.columns || [];
  $('a-cards').innerHTML = rows.map((r) => {
    const at = (c) => r[cols.indexOf(c)];
    return `<div class="card"><span>${at('source')} · ${at('account_id')} · ${at('acc_type')} · ${at('currency') || '幣種未定'}</span>
      <b>${money(at('net_liquidation'))}</b>
      ${MONEY.slice(1).map((c) => `<span>${c} ${money(at(c))}</span>`).join('')}</div>`;
  }).join('');
  renderTable($('a-table'), sourceFirst(body.data));
  $('a-at').textContent = '更新於 ' + new Date().toLocaleTimeString('zh-HK');
}

// ---------- 標的 ----------
// 清單按來源分區：一次請求即四區同時填充（後端本来就是一次向各家取齊，唔使逐間打）。每區如實顯示
// 該家的狀態：有返回／無返回／不提供（依能力聲明）——三者含義不同，不可混為一談。
// 離線 CODES 係存放嘅快照，唔涉及即時取數，因此唔分區。
const LIST_CAPS = { stocks: ['STOCK'], futures: ['FUTURE'], indices: ['INDEX'], all: ['STOCK', 'FUTURE', 'INDEX'] };

function buildPanels() {
  $('c-panels').innerHTML = (state.caps ? state.caps.sources : []).map((s) => `<div class="panel srcp" data-src="${esc(s)}">
    <div class="phead"><b>${esc(s)}</b><i class="msg busy">讀取中…</i></div>
    <div class="scroll"></div></div>`).join('');
}

// 離線快照的年齡：由 /codes/meta 離線讀回，不需要任何券商連線。快照往往是唯一的離線副本，過舊時
// 搜尋會查唔到新上市的代碼，所以零結果要一併提示可以撳「更新離線 CODES」。各券商各存一檔，故只講所選那家。
let snapshot = null;

// 本頁所有離線 CODES 操作都以所選券商為準（讀取、更新、快照狀態）；未填時跟閘道的預設券商。
const codesBroker = () => $('c-broker').value || 'futu';

function ageText(seconds) {
  if (!Number.isFinite(seconds)) return '無存放時間';
  for (const [unit, size] of [['天', 86400], ['小時', 3600], ['分鐘', 60]]) {
    if (seconds >= size) return `${Math.floor(seconds / size)} ${unit}前`;
  }
  return '剛剛';
}

async function loadSnapshotMeta() {
  const broker = codesBroker();
  const body = await api('/codes/meta', { broker });
  const el = $('c-snapshot');
  if (!body.status) { snapshot = null; el.textContent = `${broker}：${body.message}`; el.className = 'msg err'; return; }
  const cols = body.data.columns || [], row = (body.data.rows || [])[0] || [];
  snapshot = Object.fromEntries(cols.map((c, i) => [c, row[i]]));
  el.textContent = `${broker} 的快照 ${snapshot.rows} 條 · ${ageText(snapshot.age_seconds)}`
    + (snapshot.last_refresh_error ? ' · 上次更新失敗' : '');
  el.className = 'msg' + (snapshot.stale || snapshot.last_refresh_error ? ' warn' : '');
}

// 向所選券商重拉全量並覆蓋該家的快照（需券商連線，實測約數秒）。不帶 markets：快照就係全量，跟著
// 篩選框的市场只會令一次更新只拉到部分市場，反而被後端的縮細防護拒絕。
async function refreshCodes() {
  const broker = codesBroker();
  loading('c-msg', `向 ${broker} 重拉 CODES 並更新其快照中…（需券商連線，約數秒）`);
  const body = await withBusy($('c-refresh'), () => api('/codes/refresh', { broker }));
  note('c-msg', body);
  // 失敗時也要重讀元資料，先至見到記低咗嘅失敗原因。
  if (!body.status) { await loadSnapshotMeta(); return; }
  await loadCodes('codes');
  // loadCodes 會以重讀表格的訊息覆蓋訊息位，但更新結果（含各品種增減與沿用舊快照的說明）先至係用戶撳
  // 「更新 CODES」想睇嘅嘢，故重讀完成後把該結果還原返上去。
  note('c-msg', body);
}

async function loadCodes(path) {
  state.list = path;
  const split = path !== 'codes' && !!state.caps;
  buildPanels();
  if (!split) $('c-panels').innerHTML = '';
  loading('c-msg', `讀取${path === 'codes' ? '離線 CODES' : '四家清單'}中…`);
  const buttons = [...document.querySelectorAll('[data-list]')];
  buttons.forEach((b) => b.disabled = true);
  const params = path === 'codes' ? { broker: codesBroker() } : { markets: $('c-markets').value.trim() };
  state.listUrl = '/' + path + (Object.keys(params).length ? '?' + new URLSearchParams(params) : '');
  const body = await api('/' + path, params);
  buttons.forEach((b) => b.disabled = false);
  note('c-msg', body);
  state.cols = body.data.columns || [];
  state.rows = body.data.rows || [];
  // 先取快照年齡：零結果時 filterCodes 要用到佣判是否該提示撳「更新 CODES」。
  if (path === 'codes') await loadSnapshotMeta();
  filterCodes();
}
function filterCodes() {
  const text = $('c-filter').value.trim().toLowerCase();
  const shown = text ? state.rows.filter((r) => r.some((v) => String(v || '').toLowerCase().includes(text))) : state.rows;
  let count = `${shown.length} / ${state.rows.length} 條`;
  // 查唔到往往只係快照冇咗新上市的代碼，而唔係真係冇呢隻：過舊時直接講下一步做乜。
  if (text && !shown.length && state.list === 'codes' && snapshot && snapshot.stale) {
    count += '：無匹配；快照已過舊，可按「更新離線 CODES」重拉';
  }
  $('c-count').textContent = count;
  const partitioned = !!state.list && state.list !== 'codes' && !!state.caps;
  renderRaw(partitioned ? [] : shown);
  if (!partitioned) return;  // 離線 CODES 唔涉及即時取數，故唔分區
  const at = state.cols.indexOf('source');
  const by = new Map();
  shown.forEach((r) => {
    const s = String(at >= 0 ? r[at] : '');
    if (!by.has(s)) by.set(s, []);
    by.get(s).push(r);
  });
  document.querySelectorAll('#c-panels .srcp').forEach((p) => {
    const s = p.dataset.src, rows = by.get(s) || [];
    const provides = (LIST_CAPS[state.list] || []).some((c) => ((state.caps.adapters[s] || {}).capabilities || []).includes(c));
    const head = p.querySelector('.phead i');
    if (!provides) { head.textContent = '不提供此清單'; head.className = 'msg warn'; }
    else if (!rows.length) { head.textContent = text ? '篩選後無結果' : '無返回'; head.className = 'msg warn'; }
    else { head.textContent = `${rows.length} 條`; head.className = 'msg'; }
    renderTable(p.querySelector('.scroll'), dropSource({ columns: state.cols, rows }), 500);
  });
}

// 唔分區時（離線 CODES，或能力聲明讀取失敗）以單一表格顯示：欄位與順序即接口原樣返回者。
function renderRaw(shown) {
  const panel = $('c-raw');
  panel.hidden = !shown.length;
  if (panel.hidden) { $('c-raw-table').innerHTML = ''; return; }
  $('c-raw-title').textContent = state.list === 'codes' ? '離線 CODES' : '即時清單';
  $('c-raw-info').textContent = `GET ${state.listUrl} → ${shown.length} 條`;
  renderTable($('c-raw-table'), { columns: state.cols, rows: shown }, 500);
}

// ---------- 日誌 ----------
async function loadLogs() {
  const hint = loading('l-msg', '讀取日誌中…', 400);
  const body = await withBusy($('l-load'), () => api('/logs', { limit: $('l-limit').value }));
  hint();
  note('l-msg', body);
  const el = $('l-table');
  const rows = (body.data.rows || []).map((r) => `<tr><td>${r[1]}</td><td class="lvl-${r[2]}">${r[2]}</td><td style="text-align:left">${r[3]}</td></tr>`).join('');
  el.innerHTML = `<table><thead><tr><th>時間</th><th>級別</th><th style="text-align:left">內容</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ---------- 券商連線狀態 ----------
// 探測會實際向各家發一次戶口查詢，故只手動觸發，不做定時輪詢。
async function probeBrokers() {
  $('b-probe').disabled = true;
  $('brokers').innerHTML = '<span class="msg">探測各券商連線中…</span>';
  const body = await api('/brokers');
  $('b-probe').disabled = false;
  const cols = (body.data && body.data.columns) || [], rows = (body.data && body.data.rows) || [];
  if (!cols.length) { $('brokers').innerHTML = ''; return; }
  const at = (n) => cols.indexOf(n);
  $('brokers').innerHTML = rows.map((r) => {
    const on = r[at('connected')] === true;
    const ms = r[at('latency_ms')];
    const why = r[at('detail')] || `延遲 ${Math.round(ms)}ms，${r[at('accounts')]} 個戶口`;
    return `<span class="chip" title="${esc(why)}"><span class="dot ${on ? 'on' : 'off'}"></span>`
      + `<b>${esc(r[at('source')])}</b><i>${on ? Math.round(ms) + 'ms' : '斷開'}</i></span>`;
  }).join('');
}

// ---------- 連接 ----------
async function connect() {
  state.key = $('key').value.trim();
  localStorage.setItem('gw_key', state.key);
  const health = await api('/health');
  if (!health.status) return;
  const caps = await api('/capabilities');
  if (!caps.status) { setStatus(false, caps.message); return; }
  state.caps = caps.data;
  const sources = caps.data.sources;
  $('sources').textContent = '來源：' + (sources.join(' ') || '無');
  $('k-broker').innerHTML = sources.map((s) => `<option value="${s}">${s}</option>`).join('');
  // 離線 CODES 按券商各存一檔，故本頁的讀取／更新都以所選券商為準；預設選閘道的預設券商，
  // 與接口省略 broker 時的行為一致（能力聲明不含它時自然不會被選中）。
  $('c-broker').innerHTML = sources.map((s) => `<option value="${s}"${s === 'futu' ? ' selected' : ''}>${s}</option>`).join('');
  // 週期預設 1 分鐘（K 線頁的既定預設）；能力聲明冇 1m 時自然留返第一項，唔憑空揀一個冇嘅週期。
  $('k-ktype').innerHTML = caps.data.ktypes.map((k) => `<option value="${k}"${k === '1m' ? ' selected' : ''}>${k}</option>`).join('');
  $('a-type').innerHTML = caps.data.acc_filters.map((t) => `<option value="${t}">${t}</option>`).join('');
  const autypes = [...new Set(Object.values(caps.data.adapters).flatMap((a) => a.autypes))];
  $('k-autype').innerHTML = '<option value="">預設</option>' + autypes.map((a) => `<option value="${a}">${a}</option>`).join('');
  setStatus(true, '已連接');
  loadLogs();
  probeBrokers();
}

// ---------- 事件 ----------
document.querySelectorAll('nav button').forEach((btn) => btn.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('active', b === btn));
  document.querySelectorAll('main section').forEach((s) => s.classList.toggle('active', s.id === 'tab-' + btn.dataset.tab));
  if (btn.dataset.tab in lastAuto) lastAuto[btn.dataset.tab] = Date.now() / 1000;  // 切換分頁即重新計時
  // 首次進入戶口頁即取一次，否則要等到下一個刷新週期先見到資料。
  if (btn.dataset.tab === 'accounts' && !$('a-table').innerHTML) loadAccounts();
}));
$('connect').addEventListener('click', connect);
$('b-probe').addEventListener('click', probeBrokers);
$('k-load').addEventListener('click', loadKline);
$('k-stream').addEventListener('click', () => (state.ws ? stopStream() : startStream()));
$('a-load').addEventListener('click', loadAccounts);
$('l-load').addEventListener('click', loadLogs);
$('c-filter').addEventListener('input', filterCodes);
$('c-refresh').addEventListener('click', refreshCodes);
document.querySelectorAll('[data-list]').forEach((b) => b.addEventListener('click', () => loadCodes(b.dataset.list)));
// 換券商即換了一檔快照：離線清單與快照狀態都要跟著改，否則顯示嘅係另一家嘅代碼表。
// 離線表格嗰邊 loadCodes 完尾已重讀快照，此處再叫一次只會多重覆一次同一檔。
$('c-broker').addEventListener('change', () => { if (state.list === 'codes') loadCodes('codes'); else loadSnapshotMeta(); });
// 改秒數後由現在重新計時；填 0 即停止自動更新。
$('a-interval').addEventListener('input', () => { lastAuto.accounts = Date.now() / 1000; });
$('c-interval').addEventListener('input', () => { lastAuto.codes = Date.now() / 1000; });
setInterval(() => { if ($('l-auto').checked && document.querySelector('#tab-logs.active')) loadLogs(); }, 3000);

// 自動更新以秒為單位，0 即不自動更新（預設）。只更新當前可見的分頁，且不在請求在途時觸發：
// 跨四家嘅請求可達十幾秒，逐秒疊加會把閘道堵死。手動按鈕照樣可用。
const lastAuto = { accounts: Date.now() / 1000, codes: Date.now() / 1000 };
const secondsOf = (id) => Math.max(0, Number($(id).value) || 0);

// 標的頁的定時更新預設只重讀離線快照（不打券商）；選上「自動向券商重拉」先至定時向券商重取清單。
function autoCodes() {
  if ($('c-live').checked) loadCodes(state.list && state.list !== 'codes' ? state.list : 'all');
  else loadCodes('codes');
}

setInterval(() => {
  const tab = document.querySelector('main section.active');
  const key = tab ? tab.id.slice('tab-'.length) : '';
  if (!(key in lastAuto)) return;
  const gap = secondsOf(key === 'accounts' ? 'a-interval' : 'c-interval');
  if (!gap || inFlight || Date.now() / 1000 - lastAuto[key] < gap) return;
  lastAuto[key] = Date.now() / 1000;
  (key === 'accounts' ? loadAccounts : autoCodes)();
}, 1000);
connect();
</script>
</body>
</html>

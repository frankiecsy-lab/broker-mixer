<!DOCTYPE html>
<!-- brokery_webui 主頁：上方為菜單（戶口清單、標的列表、K 線拉取、K 線串流、K 線串流（多週期）、BROKER 管理）。
     所有資料均由本應用的 /api/* 轉發閘道取得，串流由 /ws/stream 代理，頁面不含任何金鑰，也不直接連接券商。 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brokery Web UI</title>
<!-- 圖表規格只有一份：由本應用的 /static 取 brokery/static/ 下的本地副本（無 CDN，離線與 Docker 都畫到圖） -->
<script src="/static/echarts.min.js"></script>
<script src="/static/chart.js"></script>
<!-- 多週期頁的格子容器（一格一週期 + 每格上方的週期按鈕）與圖表規格同源，同樣只有一份 -->
<script src="/static/chart_grid.js"></script>
<style>
  :root { --bg:#12161c; --panel:#1a2028; --line:#2b3441; --fg:#dfe6ef; --dim:#8a97a8;
          --up:#e0524a; --down:#2ea36f; --accent:#4b9ece; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 "Segoe UI","Microsoft JhengHei",sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { color:var(--dim); font-size:12px; }
  #status { margin-left:auto; color:var(--dim); font-size:12px; }
  nav { display:flex; gap:4px; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  nav button { background:transparent; border:1px solid transparent; color:var(--dim); font:inherit;
               padding:5px 10px; border-radius:4px; cursor:pointer; }
  nav button.active { color:var(--fg); border-color:var(--line); background:#0f1318; }
  main { padding:16px; }
  section { display:none; } section.active { display:block; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  button.act { background:var(--accent); border:1px solid var(--accent); color:#08131c; font:inherit;
               font-weight:600; border-radius:4px; padding:5px 10px; cursor:pointer; }
  .chip { display:inline-flex; gap:6px; align-items:center; padding:3px 9px; background:var(--panel);
          border:1px solid var(--line); border-radius:12px; font-size:12px; }
  .bar label { display:inline-flex; gap:6px; align-items:center; color:var(--dim); font-size:12px; }
  select { background:#0f1318; color:var(--fg); border:1px solid var(--line); border-radius:4px;
           font:inherit; padding:5px 8px; }
  input.num { width:64px; background:#0f1318; color:var(--fg); border:1px solid var(--line);
              border-radius:4px; font:inherit; padding:5px 6px; }
  input.txt { width:132px; background:#0f1318; color:var(--fg); border:1px solid var(--line);
              border-radius:4px; font:inherit; padding:5px 6px; }
  .chart { width:100%; height:420px; }
  /* 券商開關一行一家：未配置者（.env 未啟用）不可勾選，原因寫在同一行，不用按了才知道。 */
  .switch { display:flex; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); }
  .switch b { font-weight:600; }
  .switch i { color:var(--dim); font-style:normal; font-size:12px; }
  .switch input:disabled + b { color:var(--dim); }
  button.act:disabled { background:var(--line); border-color:var(--line); color:var(--dim); cursor:default; }
  .chip b { font-weight:600; } .chip i { color:var(--dim); font-style:normal; }
  .msg { color:var(--dim); margin:8px 0; }
  .msg.err { color:var(--up); }
  .msg.warn { color:#d8a24a; }
  .msg.busy { color:var(--accent); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:4px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--dim); font-weight:500; position:sticky; top:0; background:var(--panel); }
  .scroll { max-height:70vh; overflow:auto; }
  /* 多週期頁：3×3 九格同時串流，下方不列 DF。格子由 brokery/static/chart_grid.js 生成，呢度只負責排版：
     一行三格、不足九格時由 grid-auto-rows 自己加行（只聲明一個週期者即一格佔一行），唔使界面分情況。 */
  #kg-grid { height:76vh; }
  .brokery-grid { display:grid; height:100%; grid-template-columns:repeat(3,1fr); grid-auto-rows:1fr; gap:6px; }
  .brokery-cell { display:flex; flex-direction:column; min-width:0; min-height:0;
                  border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .brokery-tabs { display:flex; flex-wrap:nowrap; gap:2px; padding:3px 3px 0; }
  .brokery-tabs button { flex:1 1 auto; min-width:0; padding:2px 0; cursor:pointer;
                         font:10px/1.2 inherit; color:var(--dim); background:#0f1318;
                         border:1px solid var(--line); border-radius:3px; }
  .brokery-tabs button.on { color:var(--fg); background:#2b3a4d; border-color:#3d566f; }
  .brokery-note { padding:1px 4px; font-size:10px; color:var(--dim);
                  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brokery-pane { flex:1 1 auto; min-height:0; }
</style>
</head>
<body>
<header>
  <h1>brokery</h1>
  <span class="sub">量化交易</span>
  <span id="status">未取數</span>
</header>

<!-- 新增頁面時在此加一個 button[data-page]，並在 main 內加對應的 section。 -->
<nav id="menu">
  <button data-page="accounts" class="active">戶口清單</button>
  <button data-page="symbols">標的列表</button>
  <button data-page="kline-pull">K 線拉取</button>
  <button data-page="kline-stream">K 線串流</button>
  <button data-page="kline-grid">K 線串流（多週期）</button>
  <button data-page="brokers">BROKER 管理</button>
</nav>

<main>
  <section id="page-accounts" class="active">
    <div class="bar">
      <button class="act" id="a-refresh">重新整理</button>
      <!-- 自動更新以秒為單位，0 即不自動更新（預設）：戶口數目少但每次都要向各家取數，
           預設不自動打券商，避免頁面在背景持續佔用連線。 -->
      <label>自動更新（秒）<input type="number" id="a-interval" class="num" min="0" step="5" value="0"></label>
      <span id="a-sources"></span>
    </div>
    <div class="msg" id="a-msg"></div>
    <div class="panel"><div class="scroll" id="a-table"></div></div>
  </section>

  <!-- 篩選在上方（類型／市場／券商），下方為取得的清單。選項均由接口返回，頁面不硬寫券商或市場名單。 -->
  <section id="page-symbols">
    <div class="bar">
      <label>類型
        <select id="s-kind">
          <option value="stock" selected>股票</option>
          <option value="future">期貨</option>
          <option value="index">指數</option>
        </select>
      </label>
      <label>市場<select id="s-market"><option value="">全部</option></select></label>
      <label>券商<select id="s-broker"></select></label>
      <button class="act" id="s-refresh">取得</button>
      <!-- 自動更新同樣以秒為單位，0 即不自動更新（預設）。未選「自動向券商重拉」時，定時器只重讀
           離線快照（不打券商）；選上才定時向券商即時重取清單。 -->
      <label>自動更新（秒）<input type="number" id="s-interval" class="num" min="0" step="5" value="0"></label>
      <label><input type="checkbox" id="s-live">自動向券商重拉</label>
      <span id="s-sources"></span>
    </div>
    <!-- 離線 CODES 快照另列一列：本頁的清單是即時取數，快照只是存放中的代碼表（供搜尋與離線查看），
         兩者含義不同，不可混在同一個統計裡。快照按券商各存一檔，故此列只講所選券商那一檔。 -->
    <div class="bar">
      <span id="s-snapshot" class="msg"></span>
      <button class="act" id="s-codes-load">讀取離線 CODES</button>
      <button class="act" id="s-codes-refresh">更新離線 CODES</button>
    </div>
    <div class="msg" id="s-msg"></div>
    <div class="panel"><div class="scroll" id="s-table"></div></div>
  </section>

  <!-- K 線兩頁的預設值一律寫在控件上（標的 HK.HSImain、週期 1m、根數 1000）：換券商不會改變它，
       且能力聲明讀取失敗時仍有可用的預設。根數可任填（上限 100000，與桌面 GUI 一致）：實際深度不足時
       閘道在訊息中點名該來源該週期可得幾多根，頁面原樣顯示，不自造第二套說法。
       週期選項其後由 /api/capabilities 補齊，保留 1m 為選中。
       下方表格列全部行並按時間反序（最新在最上）；反序屬顯示層，取回的资料仍按時間升序。 -->
  <section id="page-kline-pull">
    <div class="bar">
      <label>代碼<input type="text" id="kp-code" class="txt" value="HK.HSImain"></label>
      <label>週期<select id="kp-ktype"><option value="1m" selected>1m</option></select></label>
      <label>根數<input type="number" id="kp-count" class="num" min="1" max="100000" value="1000"></label>
      <label>券商<select id="kp-broker"></select></label>
      <button class="act" id="kp-load">取得</button>
      <span id="kp-sources"></span>
    </div>
    <div class="msg" id="kp-msg"></div>
    <div class="panel"><div class="scroll" id="kp-table"></div></div>
  </section>

  <!-- 串流經本應用的 /ws/stream 代理連閘道：金鑰只在服務端。每條 update 帶的是該代碼目前完整的 bar，
       一律經合併規則處理（同時間覆蓋、保留最新 N 根，N 即上方所填的根數），故不會把已取得的歷史縮返最近幾十根。
       訂閱一律先取歷史再開串流，故圖表上永遠是一條連續序列；圖表在表格上方，同一份序列，且所請求的根數全部喺圖上。
       一份串流由「請求簽名」（券商、週期、代碼、根數、復權）界定：同一券商同一週期照樣可並行多條（例如另一頁
       或另一格以不同根數或代碼訂閱），再無名額可等。協定錯誤（ktype_unsupported、broker_disabled、bad_request）
       原樣呈現，參數由用戶改，頁面不自動重送訂閱（與桌面 GUI 同一口徑）。 -->
  <section id="page-kline-stream">
    <div class="bar">
      <label>代碼<input type="text" id="ks-code" class="txt" value="HK.HSImain"></label>
      <label>週期<select id="ks-ktype"><option value="1m" selected>1m</option></select></label>
      <label>根數<input type="number" id="ks-count" class="num" min="1" max="100000" value="1000"></label>
      <label>券商<select id="ks-broker"></select></label>
      <button class="act" id="ks-start">訂閱</button>
      <button class="act" id="ks-stop" disabled>停止</button>
      <span id="ks-sources"></span>
    </div>
    <div class="msg" id="ks-msg"></div>
    <div class="panel">
      <div class="chart" id="ks-chart"></div>
      <div class="scroll" id="ks-table"></div>
    </div>
  </section>

  <!-- 多週期頁：一次過串流 3×3 = 九個 K 線圖，流程同「K 線串流」（先取歷史、再開串流），但下方不列 DF，
       每個小圖上方有一排水平週期按鈕。格子與週期按鈕一律由該券商聲明的 stream_ktypes 決定（順序照
       /api/capabilities 返回者）：界面不自行排列週期，也不憑空補出會被閘道拒絕的週期（只聲明 1m 者即一格）。
       根數為一個共用輸入（預設 300）：九格各取 1000 根會令來源逐格分頁，首次開始明顯變慢。
       一個「開始／停止」管全部格子；逐格只有週期按鈕，換一格即只重取嗰格、只退該週期的串流。
       九個週期只開一條 /ws/stream：瀏覽器對同一來源的連線數有限（HTTP/1.1 約 6 條），九條會連不上，
       而閘道按請求簽名界定一份串流，一條連接可有多個訂閱，每份 update 自帶 ktype 供本頁分派。
       同一券商同一週期亦可與本頁並行：其他頁以不同根數或代碼訂閱同一週期時，兩邊各自收到推送。 -->
  <section id="page-kline-grid">
    <div class="bar">
      <label>代碼<input type="text" id="kg-code" class="txt" value="HK.HSImain"></label>
      <label>根數（每格）<input type="number" id="kg-count" class="num" min="1" max="100000" value="300"></label>
      <label>券商<select id="kg-broker"></select></label>
      <button class="act" id="kg-start">開始</button>
      <button class="act" id="kg-stop" disabled>停止</button>
      <span id="kg-sources"></span>
    </div>
    <div class="msg" id="kg-msg"></div>
    <div class="panel"><div id="kg-grid"></div></div>
  </section>

  <!-- 券商開關是全域喜好（存放在閘道端一個 JSON 檔，三個界面共用同一份）：被停用者不會被任何動作經過，
       各頁面的券商下拉框亦即時不再列出。本頁只讀寫該檔，不向任何券商取數；未配置者（.env 未啟用）不可勾選。 -->
  <section id="page-brokers">
    <div class="bar">
      <button class="act" id="b-apply">套用</button>
      <button class="act" id="b-reload">重新讀取</button>
      <span class="msg">開關為全域設定，套用後即時生效，不需重新啟動。</span>
    </div>
    <div class="msg" id="b-msg"></div>
    <div class="panel" id="b-list"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
// 資金欄位按數值顯示（千分位與兩位小數）；其餘欄位一律按原樣文字顯示，不重新解讀。
const MONEY = new Set(['net_liquidation', 'cash', 'market_value', 'available_funds', 'buying_power',
                       'init_margin', 'maint_margin', 'equity_with_loan', 'unrealized_pnl', 'realized_pnl']);

function esc(text) {
  return String(text).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function cell(value, column) {
  if (value === null || value === undefined) return '—';   // 缺失值一律顯示破折號，不以任何數字湊出
  if (MONEY.has(column)) return Number(value).toLocaleString('en-US',
      { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return esc(value);
}

function setMsg(el, text, cls) {
  el.textContent = text;
  el.className = 'msg' + (cls ? ' ' + cls : '');
}

function setStatus(text, ok) {
  const el = $('status');
  el.textContent = text;
  el.style.color = ok === false ? 'var(--up)' : (ok ? 'var(--down)' : 'var(--dim)');
}

function renderTable(el, data) {
  if (!data.columns || !data.columns.length) { el.innerHTML = ''; return; }
  const head = data.columns.map((c) => `<th>${esc(c)}</th>`).join('');
  const body = data.rows.map((row) => `<tr>${row.map((v, i) => `<td>${cell(v, data.columns[i])}</td>`).join('')}</tr>`).join('');
  el.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

// 按來源統計條數：只由返回的行統計，沒返回的來源不會出現，避免憑空列出一間「0 條」。
function renderCounts(el, data, unit) {
  const index = (data.columns || []).indexOf('source');
  if (index < 0) { el.innerHTML = ''; return; }
  const counts = new Map();
  data.rows.forEach((row) => counts.set(row[index], (counts.get(row[index]) || 0) + 1));
  el.innerHTML = [...counts.entries()]
    .map(([src, n]) => `<span class="chip"><b>${esc(src)}</b><i>${n} ${unit}</i></span>`).join('');
}

let inFlight = 0;   // 進行中的請求數：定時更新只在沒有在途請求時觸發，避免慢請求疊加

// 進行中即把按鈕停用：取 1000 根 K 線需數秒，期間重覆送出只會疊加同一個請求。
async function withBusy(btn, fn) {
  btn.disabled = true;
  try {
    return await fn();
  } finally {
    btn.disabled = false;
  }
}

async function loadInto(msgEl, tableEl, countEl, unit, url, busy) {
  inFlight++;
  try {
    return await request(msgEl, tableEl, countEl, unit, url, busy);
  } finally {
    inFlight--;
  }
}

// 取數並顯示：兩個頁面同一流程，差別只在接口與單位。失敗原因一律原樣顯示，不自行改寫或掩飾。
async function request(msgEl, tableEl, countEl, unit, url, busy) {
  setMsg(msgEl, busy || '讀取中…', 'busy');
  let body;
  try {
    const resp = await fetch(url);
    body = await resp.json();
  } catch (err) {
    setStatus('閘道不可達', false);
    setMsg(msgEl, `請求失敗：${err}`, 'err');
    return;
  }
  const data = body.data || { columns: [], rows: [] };
  renderTable(tableEl, data);
  renderCounts(countEl, data, unit);
  // 個別券商失敗時閘道仍返回已取得的資料（status=True，原因寫在 message），故以警告色提示而不當作失敗。
  if (!body.status) { setStatus('取數失敗', false); setMsg(msgEl, body.message, 'err'); }
  else {
    setStatus('已連接閘道', true);
    setMsg(msgEl, body.message, body.message.includes('注意') || body.message.includes('失敗') ? 'warn' : '');
  }
  return body;
}

function loadAccounts() {
  return loadInto($('a-msg'), $('a-table'), $('a-sources'), '個戶口', '/api/accounts');
}

const KIND_LABEL = { stock: '股票', future: '期貨', index: '指數' };
// 能力聲明以 symbol_type 的大寫常量表達（見 brokers/codes.py），與選項值大小寫不同，必須顯式對應。
const KIND_CAPABILITY = { stock: 'STOCK', future: 'FUTURE', index: 'INDEX' };
let brokerCaps = {};              // 券商 → 其聲明的品種與可串流週期；由 /api/capabilities 取得，頁面不硬寫券商名單
let ktypes = [];                  // 閘道可用的 K 線週期：同樣只由能力聲明決定，不憑空列舉
const seenMarkets = new Set();    // 只列實際返回過的市場，不憑空給出選項
// 券商下拉框只有一處填充：/api/capabilities 只返回生效的券商，所以在 BROKER 管理停用一家後，
// 所有頁面的選項都會一併少一家，不需要逐頁處理。
const BROKER_SELECTS = ['s-broker', 'kp-broker', 'ks-broker', 'kg-broker'];
const KTYPE_SELECTS = ['kp-ktype', 'ks-ktype'];   // 多週期頁沒有週期下拉框：格子即週期，見 gridPane

async function loadBrokers(force) {
  if (!Object.keys(brokerCaps).length || force) {
    try {
      const body = await (await fetch('/api/capabilities')).json();
      if (!body.status) { setMsg($('s-msg'), body.message, 'err'); return; }
      brokerCaps = body.data.adapters || {};
      ktypes = body.data.ktypes || [];
    } catch (err) {
      setMsg($('s-msg'), `讀取券商能力失敗：${err}`, 'err');
      return;
    }
  }
  renderBrokers();
  renderKtypes();
  renderGrid();
}

// 券商選項按各家的能力聲明標註：不提供所選品種的選項設為不可選，原因在選項上寫明，
// 而不是讓用戶按了才知道會報 type_unsupported。原本選中嘅一家若已喺 BROKER 管理中被停用，
// 自動改回 futu；futu 不可用時改返回列表第一家，絕不留空。
function renderBrokers() {
  const kind = $('s-kind').value;
  const names = Object.keys(brokerCaps);
  for (const id of BROKER_SELECTS) {
    const el = $(id);
    const preferred = names.includes(el.value) ? el.value : (names.includes('futu') ? 'futu' : names[0]);
    el.innerHTML = names.map((name) => {
      const supported = id !== 's-broker' || (brokerCaps[name].capabilities || []).includes(KIND_CAPABILITY[kind]);
      const label = supported ? name : `${name}（不提供${KIND_LABEL[kind]}）`;
      return `<option value="${esc(name)}"${supported ? '' : ' disabled'}${name === preferred ? ' selected' : ''}>${esc(label)}</option>`;
    }).join('');
  }
}

// 週期選項由閘道的清單填；頁面已預填 1m（見各 section），故能力聲明讀取失敗時仍然可用。
function renderKtypes() {
  for (const id of KTYPE_SELECTS) {
    const el = $(id);
    const names = ktypes.length ? ktypes : [el.value || '1m'];
    const preferred = names.includes(el.value) ? el.value : (names.includes('1m') ? '1m' : names[0]);
    el.innerHTML = names.map((name) => `<option value="${esc(name)}"${name === preferred ? ' selected' : ''}>${esc(name)}</option>`).join('');
  }
}

function renderMarkets() {
  const current = $('s-market').value;
  $('s-market').innerHTML = '<option value="">全部</option>'
    + [...seenMarkets].sort().map((m) => `<option value="${esc(m)}"${m === current ? ' selected' : ''}>${esc(m)}</option>`)
    .join('');
}

async function loadSymbols() {
  const kind = $('s-kind').value;
  const market = $('s-market').value;
  const params = new URLSearchParams({ kind, broker: $('s-broker').value });
  if (market) params.set('market', market);
  const body = await loadInto($('s-msg'), $('s-table'), $('s-sources'), '條', `/api/symbols?${params}`,
                              `向 ${params.get('broker')} 取${KIND_LABEL[kind]}清單…`);
  if (!body) return;
  const index = (body.data?.columns || []).indexOf('market');
  if (index >= 0) (body.data.rows || []).forEach((row) => seenMarkets.add(row[index]));
  renderMarkets();
}

// 讀取離線 CODES：只讀所選券商存放的那一檔（實測 0.03s），不向券商取數，因此不需要連線。各券商各一檔，
// 內容由該家聲明的能力決定（不提供股票者只有期貨與指數），故讀 futu 不會混入別家的 conId。
async function loadOfflineCodes() {
  const broker = $('s-broker').value || 'futu';
  const body = await loadInto($('s-msg'), $('s-table'), $('s-sources'), '條',
                              `/api/codes?broker=${encodeURIComponent(broker)}`,
                              `離線讀取 ${broker} 的 CODES…`);
  if (body && body.status) setMsg($('s-msg'), `${body.message}（離線讀取，未向券商取數）`);
  return body;
}

// 離線 CODES 快照的狀態：經 /api/codes/meta 轉發閘道，離線執行，不需要任何券商連線。快照往往是
// 唯一的離線副本，過舊時會查唔到新上市的代碼，故以警告色標示並提示可更新。按券商分檔，故只講所選那家。
let snapshot = null;

function ageText(seconds) {
  if (!Number.isFinite(seconds)) return '無存放時間';
  for (const [unit, size] of [['天', 86400], ['小時', 3600], ['分鐘', 60]]) {
    if (seconds >= size) return `${Math.floor(seconds / size)} ${unit}前`;
  }
  return '剛剛';
}

async function loadSnapshotMeta() {
  const el = $('s-snapshot');
  const broker = $('s-broker').value || 'futu';
  let body;
  try {
    body = await (await fetch(`/api/codes/meta?broker=${encodeURIComponent(broker)}`)).json();
  } catch (err) {
    setMsg(el, `讀取 ${broker} 的離線 CODES 狀態失敗：${err}`, 'err');
    return;
  }
  if (!body.status) { snapshot = null; setMsg(el, `${broker} 的離線 CODES：${body.message}`, 'err'); return; }
  const cols = body.data.columns || [], row = (body.data.rows || [])[0] || [];
  snapshot = Object.fromEntries(cols.map((c, i) => [c, row[i]]));
  setMsg(el, `${broker} 的離線 CODES：${snapshot.rows} 條 · ${ageText(snapshot.age_seconds)}`
         + (snapshot.last_refresh_error ? ' · 上次更新失敗' : ''),
         snapshot.stale || snapshot.last_refresh_error ? 'warn' : '');
}

async function refreshCodes() {
  const btn = $('s-codes-refresh');
  const broker = $('s-broker').value || 'futu';
  btn.disabled = true;   // 重拉需數秒，期間不可重覆送出
  setMsg($('s-msg'), `向 ${broker} 重拉 CODES 並更新其離線快照中…（需券商連線，約數秒）`, 'busy');
  try {
    const body = await (await fetch(`/api/codes/refresh?broker=${encodeURIComponent(broker)}`)).json();
    // 失敗原因原樣顯示（例如某品種明顯縮細而拒絕覆蓋）：用戶需要知道快照並未改變。
    setMsg($('s-msg'), body.message, body.status ? '' : 'err');
  } catch (err) {
    setMsg($('s-msg'), `請求失敗：${err}`, 'err');
  } finally {
    btn.disabled = false;
    loadSnapshotMeta();   // 成敗都要重讀：失敗原因會記進快照的 meta
  }
}

// ---------- K 線（拉取／串流兩頁同一流程，只有控件前綴與是否畫圖不同）----------
// 串流頁在表格上方畫圖，拉取頁只列表格。
// 圖表與表格一律交共用規格 brokery/static/chart.js：呢度只攞數同餵數，唔再自己拼 ECharts option。
// 每頁各持一份控件、序列與連接（即桌面 GUI 的 KlinePane／KlineChart 喺頁面的對應物）：兩頁互不影響。
// 每頁的序列經同一個 store 合併（key=(代碼,時間)，同時間覆蓋，保留最新 N 根，N 即該頁所填的根數），
// 所以一條只帶最近 count 根的 update 唔會把已拉取的歷史縮返最近幾十根。
function klinePane(prefix, options) {
  const el = (suffix) => $(`${prefix}-${suffix}`);
  const pane = { store: window.BrokeryChart ? BrokeryChart.store(1000) : null, key: '',
                 ws: null, wants: false };
  const controls = () => ({ code: el('code').value.trim(), ktype: el('ktype').value,
                            count: Number(el('count').value) || 1000, broker: el('broker').value });

  pane.say = (text, ok) => {
    setStatus(ok === false ? '取數失敗' : '已連接閘道', ok !== false);
    setMsg(el('msg'), text, ok === false ? 'err' : '');
  };

  pane.paint = () => {
    const payload = pane.store ? pane.store.payload() : { columns: [], rows: [] };
    if (options.chart) {
      if (!window.echarts || !payload.rows.length) {
        el('chart').innerHTML = '<div class="msg">無圖表（未能載入 ECharts，或返回不含 OHLC）</div>';
      } else {
        // start: 0 即所請求的根數全部喺圖上（預設 60 根嘅可視窗只屬預設值，唔該跟用戶要的根數）；
        // dataZoom 照可縮放。ktype 屬該次輸入的一部分，故每次都要交（換週期後 x 軸格式先至跟住改）。
        BrokeryChart.render(el('chart'), payload, null, { ktype: controls().ktype, start: 0 });
      }
    }
    // 按時間反序（最新在最上）屬顯示層：store 內部與取回的资料仍按時間升序，圖表與跨券商對齊靠升序。
    // 表格列全部行，唔再截返最前幾十行：攞幾多根即見幾多行，與上方的根數統計一致。
    const reversed = BrokeryChart.desc(payload);
    renderTable(el('table'), { columns: reversed.columns, rows: reversed.rows });
    renderCounts(el('sources'), reversed, '根');
  };

  pane.merge = (payload) => {
    if (!pane.store) return;
    // 換標的或換週期即換咗一個序列：唔清走舊 bar 會喺同一條軸上混埋兩份唔同週期的資料。
    const key = `${controls().code}|${controls().ktype}`;
    if (pane.key !== key) { pane.store.clear(); pane.key = key; }
    pane.store.add(payload);
    pane.paint();
  };

  pane.pull = async () => {
    const c = controls();
    // 換標的或換週期即換咗一個序列：取數前先清，失敗時先至唔會喺新標的嘅錯誤下面留返舊標的嘅 bar，
    // 「無 bar 即唔訂閱」嘅判斷亦先至屬實。
    const key = `${c.code}|${c.ktype}`;
    if (pane.store && pane.key !== key) { pane.store.clear(); pane.key = key; pane.paint(); }
    // 合併器的上限要跟本次請求的根數：寫死 1000 時取 3000 根會被裁返 1000 根（與桌面 GUI 同一口徑）。
    if (pane.store) pane.store.setLimit(c.count);
    const params = new URLSearchParams({ code: c.code, ktype: c.ktype, count: c.count, broker: c.broker });
    setMsg(el('msg'), `向 ${c.broker} 取 ${c.code} 的 ${c.ktype} K 線（${c.count} 根）…`, 'busy');
    let body;
    try {
      body = await (await fetch(`/api/kline?${params}`)).json();
    } catch (err) {
      setStatus('閘道不可達', false);
      setMsg(el('msg'), `請求失敗：${err}`, 'err');
      return false;
    }
    if (!body.status) { setStatus('取數失敗', false); setMsg(el('msg'), body.message, 'err'); return false; }
    setStatus('已連接閘道', true);
    setMsg(el('msg'), body.message);
    pane.merge(body.data);
    return true;
  };

  if (options.stream) {
    // 串流一律經本應用的 /ws/stream 代理：金鑰只在服務端，放進頁面即等於公開。協定（subscribed/
    // update/end…）與一份串流的界定一律由閘道判定（見 brokery_api/app.py 的 stream_key），呢邊只按事件顯示與
    // 合併，不改內容。
    pane.idle = () => {
      pane.ws = null;
      pane.wants = false;
      el('start').disabled = false;
      el('stop').disabled = true;
    };
    // 先取歷史再訂閱：update 只帶最近 count 根，直接訂閱即得返一張只有最近幾十根的圖；普通行情軟件
    // 一律係「歷史 + 實時」合併成一條連續序列。連歷史都無 bar 即唔訂閱，唔好留一張會被誤認為完整
    // 歷史嘅圖（失敗原因已由 pull 點名）。
    pane.start = async () => {
      if (pane.ws) return;
      el('start').disabled = true;
      await pane.pull();
      if (!pane.store || !pane.store.size) { el('start').disabled = false; return; }
      const c = controls();
      const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws/stream`);
      ws.onopen = () => {
        pane.wants = true;
        ws.send(JSON.stringify({ action: 'subscribe', codes: [c.code],
                                 ktype: c.ktype, count: c.count, broker: c.broker }));
      };
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.event === 'update') {   // update 只帶最近 count 根：照樣經 store 合併，唔會蓋走已拉取嘅歷史
          pane.merge(msg.data);
          pane.say(`已更新 ${msg.code}（本次 ${msg.data.rows.length} 根，合併後 ${pane.store ? pane.store.size : 0} 根）`);
        } else if (msg.event === 'subscribed') {
          pane.say(`已訂閱 ${msg.broker} ${msg.codes.join(',')} ${msg.ktype}（${msg.seconds} 秒後自動結束）`);
        } else if (msg.event === 'end' || msg.event === 'closed') {
          pane.say(msg.message || `已停止 ${msg.broker} 串流`);
          pane.idle();
        } else {
          // 協定錯誤（ktype_unsupported、broker_disabled、bad_request）原樣呈現：原因由閘道點名，參數由用戶改，
          // 頁面不自動重送訂閱（重送只會多一條用戶睇唔見嘅訂閱），亦唔解鎖按鈕——撳「停止」先收返呢條連接。
          pane.say(msg.message || msg.event, false);
        }
      };
      ws.onerror = () => pane.say('串流連線失敗：請確認閘道已啟動', false);
      ws.onclose = () => { if (pane.ws === ws) pane.idle(); };
      pane.ws = ws;
      el('start').disabled = true;
      el('stop').disabled = false;
    };
    // 「停止」即收返呢條連接（idle() 解鎖按鈕）：協定錯誤之後用戶要靠佢改參數重試。
    pane.stop = () => {
      if (!pane.ws) return;
      pane.ws.send(JSON.stringify({ action: 'stop' }));
      pane.ws.close();
      pane.idle();
    };
  }
  return pane;
}

// ---------- K 線串流（多週期）：一格一週期，九格共用一條 /ws/stream ----------
// 與 klinePane 的根本分別係狀態以「格」為單位：一格一份序列（store）、一格一個 ktype。下方不列 DF，故只有
// 圖表與每格上方一行提示（取數失敗只寫喺嗰格，唔搶走整頁的訊息）。
// 格子與週期按鈕由 brokery/static/chart_grid.js 生成，清單只取該券商聲明的 stream_ktypes：界面不自行排列、
// 不憑空補週期（只聲明 1m 者即只得一格，也撳唔到不支持的週期）。
function gridPane(prefix) {
  const el = (suffix) => $(`${prefix}-${suffix}`);
  const pane = { grid: null, layout: [], current: [], stores: [], keys: [], ws: null, wants: false };
  const controls = () => ({ code: el('code').value.trim(), count: Number(el('count').value) || 300,
                            broker: el('broker').value });

  pane.say = (text, ok) => {
    setStatus(ok === false ? '取數失敗' : '已連接閘道', ok !== false);
    setMsg(el('msg'), text, ok === false ? 'err' : '');
  };

  // 該券商聲明可串流的週期：沒有聲明即不畫格子（界面不憑空造出會被閘道拒絕的週期）。
  pane.declared = () => ((brokerCaps[controls().broker] || {}).stream_ktypes || []).map(String);

  // 能力聲明每次進入頁面都會重讀：清單未變即不重建，重建會清走各格已合併的序列（即已取到的歷史）。
  pane.build = () => {
    const ktypes = pane.declared();
    if (ktypes.join('|') === pane.layout.join('|')) return;
    pane.layout = ktypes;
    pane.current = ktypes.slice();
    pane.stores = ktypes.map(() => (window.BrokeryChart ? BrokeryChart.store(controls().count) : null));
    pane.keys = ktypes.map(() => '');
    if (!window.BrokeryGrid) {
      el('grid').innerHTML = '<div class="msg">無圖表（未能載入 BrokeryGrid）</div>';
      return;
    }
    pane.grid = BrokeryGrid.build(el('grid'), { ktypes, onPick: (index, ktype) => pane.pick(index, ktype) });
    pane.summary();
  };

  // 九格沒有表格可統計，控制列這一句即本頁唯一的取數摘要（格子數以券商聲明為準，每格根數以輸入為準）。
  pane.summary = () => {
    el('sources').innerHTML = `<span class="chip"><b>${pane.layout.length} 格</b>`
                            + `<i>每格 ${controls().count} 根</i></span>`;
  };

  pane.note = (index, text) => { if (pane.grid) pane.grid.note(index, text); };

  // 只重畫一格：ktype 省略時由容器沿用該格現有的週期（換週期由 pick 交，串流更新不需要交）。
  pane.paintCell = (index) => {
    if (!pane.grid) return;
    const payload = pane.stores[index] ? pane.stores[index].payload() : { columns: [], rows: [] };
    pane.grid.set(index, payload);
  };

  // 一格一份序列：先逐格取歷史，全部返回先至開一條串流（同單格串流頁「先取歷史再開串流」同一口徑）。
  // 逐格順序而非並行：富途 OpenD 與 IB 都不接受同一連線上的並行請求（與桌面 GUI 同一做法）。
  pane.pullCell = async (index) => {
    const c = controls();
    const ktype = pane.current[index];
    const store = pane.stores[index];
    if (store) {
      // 換標的或換週期即換咗一個序列：唔清走舊 bar 會喺同一條軸上混埋兩份唔同週期的資料。
      const key = `${c.code}|${ktype}`;
      if (pane.keys[index] !== key) { store.clear(); pane.keys[index] = key; }
      // 合併器的上限要跟本次請求的根數：寫死會把多要的根數裁走（與 klinePane 同一口徑）。
      store.setLimit(c.count);
    }
    pane.note(index, `向 ${c.broker} 取 ${ktype}…`);
    const params = new URLSearchParams({ code: c.code, ktype, count: c.count, broker: c.broker });
    let body;
    try {
      body = await (await fetch(`/api/kline?${params}`)).json();
    } catch (err) {
      pane.note(index, `請求失敗：${err}`);
      return false;
    }
    if (!body.status) { pane.note(index, body.message); return false; }
    pane.note(index, '');
    if (store) store.add(body.data);
    pane.paintCell(index);
    return true;
  };

  // 訂閱照各格而家顯示的週期送：兩格顯示同一週期時只送一次（同一份請求由閘道接手，重複送只會多一條用戶
  // 睇唔見嘅訂閱），而該週期的 update 本來就會同時填兩格。
  pane.send = (wanted) => {
    if (!pane.ws || pane.ws.readyState !== WebSocket.OPEN) return;
    const c = controls();
    for (const ktype of wanted) {
      pane.ws.send(JSON.stringify({ action: 'subscribe', codes: [c.code], ktype,
                                    count: c.count, broker: c.broker }));
    }
  };

  pane.start = async () => {
    if (pane.ws) return;
    el('start').disabled = true;
    pane.build();   // 格子以而家所選的券商為準（能力聲明可能已在 BROKER 管理後改過）
    if (!pane.layout.length) {
      pane.say('該券商沒有聲明可串流的週期', false);
      el('start').disabled = false;
      return;
    }
    for (let index = 0; index < pane.layout.length; index += 1) await pane.pullCell(index);
    const withBars = pane.stores.filter((store) => store && store.size).length;
    if (!withBars) {
      // 連歷史都沒有 bar 即不訂閱：不留一張會被誤認為完整歷史的圖（失敗原因已寫喺各格上面）。
      pane.say('沒有返回任何 K 線，故未訂閱', false);
      el('start').disabled = false;
      return;
    }
    // 九個週期只開一條 /ws/stream：瀏覽器對同一來源的連線數有限（HTTP/1.1 約 6 條），九條會直接連不上；
    // 閘道按請求簽名界定一份串流，一條連接可有多個訂閱（見 brokery_api/app.py 的 stream_key）。
    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws/stream`);
    ws.onopen = () => { pane.wants = true; pane.send([...new Set(pane.current)]); };
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.event === 'update') {
        // 每份 update 自帶 ktype：只餵顯示該週期的格子（兩格同週期即共用同一份推送）。
        const targets = pane.current.map((value, i) => (value === String(msg.ktype) ? i : -1)).filter((i) => i >= 0);
        if (!targets.length) return;
        let total = 0;
        for (const index of targets) {
          if (pane.stores[index]) pane.stores[index].add(msg.data);   // 同 klinePane：照樣合併，唔會蓋走歷史
          pane.paintCell(index);
          total = Math.max(total, pane.stores[index] ? pane.stores[index].size : 0);
        }
        pane.say(`已更新 ${msg.ktype}（本次 ${(msg.data.rows || []).length} 根，合併後 ${total} 根）`);
      } else if (msg.event === 'subscribed') {
        pane.say(`已訂閱 ${msg.broker} ${msg.codes.join(',')} ${msg.ktype}（${msg.seconds} 秒後自動結束）`);
      } else if (msg.event === 'end' || msg.event === 'closed') {
        // 一個週期結束不等於整條連接結束：換一格週期時只停該週期，其餘各格照舊推送，
        // 所以這裡既不報「已停止」，也不解鎖按鈕（那會把仍在推送的各格一併停掉）。
        // 「停止」管全部格子，其收尾提示由 stop() 自己寫；按鈕解鎖交給 onclose。
      } else {
        // 協定錯誤（ktype_unsupported、broker_disabled、bad_request）原樣寫喺控制列：原因由閘道點名，參數由用戶改，
        // 頁面不自動重送訂閱（重送只會多一條用戶睇唔見嘅訂閱），亦唔解鎖按鈕——撳「停止」先收返呢條連接。
        pane.say(msg.message || msg.event, false);
      }
    };
    ws.onerror = () => pane.say('串流連線失敗：請確認閘道已啟動', false);
    ws.onclose = () => { if (pane.ws === ws) pane.idle(); };
    pane.ws = ws;
    el('stop').disabled = false;
  };

  // 逐格只有週期按鈕：換一格即只重取那一格、只退該週期的串流，其餘各格不受影響。
  // 舊週期只有再沒有其他格子顯示時才退（兩格同週期時退了另一格就沒有推送）；新週期若已被另一格訂閱著，
  // 即沿用同一份推送，不需要也不能重複訂閱（同一份請求由閘道接手）。
  pane.pick = async (index, ktype) => {
    // 只認該券商聲明的清單（即按鈕的來源），唔可以只認「而家邊格顯示緊咩」：
    // 若某週期已被別格換走，再揀返佢就永遠換唔返，而按鈕已經高亮咗，界面即刻矛盾。
    if (index < 0 || index >= pane.current.length || !pane.layout.includes(ktype)) return;
    const streaming = Boolean(pane.wants && pane.ws && pane.ws.readyState === WebSocket.OPEN);
    const previous = pane.current[index];
    pane.current[index] = ktype;
    const shownByOtherCell = (name) => pane.current.some((value, i) => i !== index && value === name);
    if (streaming && !shownByOtherCell(previous)) {
      pane.ws.send(JSON.stringify({ action: 'stop', broker: controls().broker, ktype: previous }));
    }
    await pane.pullCell(index);
    if (streaming && !shownByOtherCell(ktype)) pane.send([ktype]);
  };

  // 一個「停止」收齊全部格子（逐格只有週期按鈕，沒有逐格停止）：裸 stop 停這條連接上的全部訂閱。
  // 收尾提示由這裡寫，唔等 closed 幀：瀏覽器一 close() 就收起連接，代理隨即拆掉上游，閘道逐個回的
  // closed 幀未必返到嚟（與桌面 GUI 同一口徑：停止的提示唔依賴閘道回幀）。
  pane.stop = () => {
    if (!pane.ws) return;
    const broker = controls().broker;
    pane.wants = false;
    if (pane.ws.readyState === WebSocket.OPEN) pane.ws.send(JSON.stringify({ action: 'stop' }));
    pane.ws.close();
    pane.idle();
    pane.say(`已停止 ${broker} 串流`);
  };

  pane.idle = () => {
    pane.ws = null;
    pane.wants = false;
    el('start').disabled = false;
    el('stop').disabled = true;
  };
  return pane;
}

const panes = {
  'kline-pull': klinePane('kp', {}),
  'kline-stream': klinePane('ks', { chart: true, stream: true }),
  'kline-grid': gridPane('kg'),
};

// 格子清單即該券商聲明的可串流週期，所以換券商要即刻換格子：與券商下拉框一樣由 loadBrokers() 統一處理。
// 只在該頁可見時重建：其他頁面進入時同樣會重讀能力聲明，在看不見的容器起九個圖表實例是白費，
// 而且零尺寸的實例要等回到本頁才 resize 得到。
function renderGrid() {
  if (!document.querySelector('#page-kline-grid.active')) return;
  panes['kline-grid'].build();
}

// ---------- BROKER 管理 ----------
// 開關是全域喜好（一個 JSON 檔，三個界面共用）：寫檔後 core 即時過濾，所以本頁寫完只要重畫開關與
// 各頁的券商下拉框，不需重新啟動任何服務。未配置者（.env 未包含）一律不可勾選，原因照原樣顯示在同一行。
async function loadPrefs() {
  let body;
  try {
    body = await (await fetch('/api/brokers/prefs')).json();
  } catch (err) {
    setMsg($('b-msg'), `讀取券商開關失敗：${err}`, 'err');
    return;
  }
  if (!body.status) { setStatus('取數失敗', false); setMsg($('b-msg'), body.message, 'err'); return; }
  setStatus('已連接閘道', true);
  renderPrefs(body.data);
  setMsg($('b-msg'), body.message);
}

function renderPrefs(data) {
  const cols = data.columns || [];
  $('b-list').innerHTML = (data.rows || []).map((row) => {
    const at = (name) => row[cols.indexOf(name)];
    const name = at('source');
    return `<label class="switch"><input type="checkbox" data-broker="${esc(name)}"${at('enabled') ? ' checked' : ''}${at('configured') ? '' : ' disabled'}>`
      + `<b>${esc(name)}</b><i>${esc(at('detail') || '')}</i></label>`;
  }).join('');
}

async function applyPrefs() {
  const enabled = [...document.querySelectorAll('#b-list input[data-broker]:checked')]
    .map((input) => input.dataset.broker);
  const params = new URLSearchParams();
  if (enabled.length) params.set('enabled', enabled.join(','));  // 全不勾即省略參數：與閘道「省略即全部停用」一致
  const body = await withBusy($('b-apply'),
                              () => fetch(`/api/brokers/prefs/update?${params}`).then((r) => r.json()));
  if (!body.status) { setStatus('取數失敗', false); setMsg($('b-msg'), body.message, 'err'); return; }
  setStatus('已連接閘道', true);
  renderPrefs(body.data);   // 寫入成功的回應即最新狀態，不需再讀一次
  setMsg($('b-msg'), body.message);
  loadBrokers(true);        // 被停用者要即時從各頁的券商下拉框消失
}

function show(page) {
  document.querySelectorAll('#menu button').forEach((b) => b.classList.toggle('active', b.dataset.page === page));
  document.querySelectorAll('main section').forEach((s) => s.classList.toggle('active', s.id === 'page-' + page));
  lastAuto[page] = Date.now() / 1000;   // 切換頁面即重新計時，不讓剛開啟就補打一次
  if (page === 'accounts') loadAccounts();
  // 先取能力聲明，券商選項填好後才讀快照與清單：兩者都以所選券商為準。
  if (page === 'symbols') loadBrokers().then(() => { loadSymbols(); loadSnapshotMeta(); });
  // K 線兩頁只填控件（券商與週期選項），不自動取數：1000 根需數秒，由用戶按「取得」或「訂閱」才取數。
  if (['kline-pull', 'kline-stream'].includes(page)) loadBrokers();
  // 多週期頁要等能力聲明返嚟先至起得到格子（格子清單即該券商聲明的可串流週期），起完再補一次 resize：
  // 本頁的格子高度由容器固定，離開再回來時 ECharts 不會自己重算尺寸。同樣不自動取數。
  if (page === 'kline-grid') loadBrokers().then(() => {
    panes['kline-grid'].build();
    if (window.BrokeryChart) BrokeryChart.resizeAll();
  });
  if (page === 'brokers') loadPrefs();
}

// 自動更新：秒數為 0 即不自動更新（預設）。只更新當前可見的頁面，且不在有請求在途時觸發。
// 標的列表的定時更新預設只重讀離線快照（不打券商）；選上「自動向券商重拉」才定時向券商即時重取。
// K 線三頁與 BROKER 管理沒有定時取數：串流由 WebSocket 推送，開關只在套用時寫檔。
const lastAuto = { accounts: 0, symbols: 0 };
const AUTO_INPUT = { accounts: 'a-interval', symbols: 's-interval' };

function intervalSeconds(id) {
  return Math.max(0, Number($(id).value) || 0);
}

function tick() {
  const page = document.querySelector('#menu button.active').dataset.page;
  if (!AUTO_INPUT[page]) return;
  const gap = intervalSeconds(AUTO_INPUT[page]);
  if (!gap || inFlight) return;
  const now = Date.now() / 1000;
  if (now - lastAuto[page] < gap) return;
  lastAuto[page] = now;
  if (page === 'accounts') loadAccounts();
  else if ($('s-live').checked) loadSymbols();
  else loadOfflineCodes();
}

// 轉類型時清空市場選項：各品種返回的市場不同，留著上一品種的市場只會白得一個 empty_list。
function switchKind() {
  seenMarkets.clear();
  $('s-market').value = '';
  renderBrokers();
  loadSymbols();
}

document.querySelectorAll('#menu button').forEach((b) => b.addEventListener('click', () => show(b.dataset.page)));
$('a-refresh').addEventListener('click', loadAccounts);
$('s-refresh').addEventListener('click', loadSymbols);
$('s-codes-load').addEventListener('click', loadOfflineCodes);
$('s-codes-refresh').addEventListener('click', refreshCodes);
$('s-kind').addEventListener('change', switchKind);
$('s-market').addEventListener('change', loadSymbols);
// 換券商即換了一檔快照：清單、市場選項與快照狀態都要跟著改，否則顯示的是另一家的代碼表。
$('s-broker').addEventListener('change', () => { loadSymbols(); loadSnapshotMeta(); });
// 改秒數後由現在重新計時；填 0 即停止自動更新。
$('a-interval').addEventListener('input', () => { lastAuto.accounts = Date.now() / 1000; });
$('s-interval').addEventListener('input', () => { lastAuto.symbols = Date.now() / 1000; });
$('kp-load').addEventListener('click', () => withBusy($('kp-load'), panes['kline-pull'].pull));
$('ks-start').addEventListener('click', panes['kline-stream'].start);
$('ks-stop').addEventListener('click', panes['kline-stream'].stop);
$('kg-start').addEventListener('click', panes['kline-grid'].start);
$('kg-stop').addEventListener('click', panes['kline-grid'].stop);
// 換券商即換咗可串流的週期清單：格子與每格上方的週期按鈕要即刻跟住重建，不需要用戶重新擷「開始」。
$('kg-broker').addEventListener('change', renderGrid);
// 摘要裡的每格根數要跟著輸入變：唔使撳「開始」先更新（取數仍由「開始」決定）。
$('kg-count').addEventListener('input', () => panes['kline-grid'].summary());
$('b-apply').addEventListener('click', applyPrefs);
$('b-reload').addEventListener('click', loadPrefs);
setInterval(tick, 1000);
show('accounts');
</script>
</body>
</html>
